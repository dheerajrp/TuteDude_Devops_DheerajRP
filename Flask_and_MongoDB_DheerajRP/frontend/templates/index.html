<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #0066cc;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <form action="/submit" method="POST">
    <div class="form-group">
      <label for="user-name">Full Name</label>
      <input type="text" id="user-name" name="name" placeholder="e.g. Aarav Sharma" required>
    </div>

    <div class="form-group">
      <label for="user-city">City</label>
      <input type="text" id="user-city" name="city" placeholder="e.g. Bengaluru" required>
    </div>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
